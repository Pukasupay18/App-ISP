# Cada Edge Function real del proyecto agrega aquí su propio bloque
# [functions.<nombre>] al crearse con `supabase functions new <nombre>`.

[functions.sincronizar-inscripciones]
enabled = true
verify_jwt = false
import_map = "./functions/sincronizar-inscripciones/deno.json"
entrypoint = "./functions/sincronizar-inscripciones/index.ts"

[functions.buscar-empresa-por-ruc]
enabled = true
verify_jwt = false
import_map = "./functions/buscar-empresa-por-ruc/deno.json"
entrypoint = "./functions/buscar-empresa-por-ruc/index.ts"
