# Cada Edge Function real del proyecto agrega aquí su propio bloque
# [functions.<nombre>] al crearse con `supabase functions new <nombre>`.

[functions.validar-pin-stand]
enabled = true
verify_jwt = false
import_map = "./functions/validar-pin-stand/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/validar-pin-stand/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/validar-pin-stand/*.html" ]

